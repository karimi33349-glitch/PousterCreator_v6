name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==1.0.0

      - name: Download verified background-removal model
        run: python tools/download_models.py

      - name: Verify required poster assets
        shell: bash
        run: |
          test -f assets/template1.jpg
          test -f assets/template2.jpg
          test -f assets/calibrib.ttf
          test -f assets/models/u2netp.onnx

      - name: Build APK
        run: flet build apk --python-version 3.12 --split-per-abi --yes --skip-flutter-doctor

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PousterCreator-apk
          path: build/**/app-*.apk
          if-no-files-found: error
